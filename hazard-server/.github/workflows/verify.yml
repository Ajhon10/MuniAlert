name: Verify server
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, fileinfo, gd, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - run: composer run verify
      - name: MySQL feature tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: municipal_hazards_test
          DB_USERNAME: root
          DB_PASSWORD: test-only-password
        run: |
          php -r '$db = new PDO("mysql:host=127.0.0.1;port=3306", "root", getenv("DB_PASSWORD")); $db->exec("CREATE DATABASE municipal_hazards_test CHARACTER SET utf8mb4");'
          php artisan test
