name: Verify MuniAlert workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            promo-video/package-lock.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: mbstring, fileinfo, gd, pdo_mysql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - run: npm ci
      - run: npm ci --prefix promo-video
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: composer --working-dir=hazard-server install --prefer-dist --no-interaction
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-and-browser-evidence
          path: |
            .cache/verification-last.json
            test-results/
          retention-days: 7
