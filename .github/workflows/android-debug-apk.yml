name: Build Android debug APK
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Approved phone-reachable HTTPS Laravel origin, without /api or credentials
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - name: Validate public API origin
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: node -e "const u = new URL(process.env.API_BASE_URL); if (u.protocol !== 'https:' || u.pathname !== '/' || u.search || u.hash || u.username || u.password) process.exit(1)"
      - name: Build and synchronize Android assets
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
        run: npm run android:sync -w hazard-client
      - run: chmod +x hazard-client/android/gradlew
      - name: Assemble debug APK
        working-directory: hazard-client/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: munialert-android-debug
          path: hazard-client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
