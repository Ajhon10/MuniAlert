<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">MuniAlert application architecture</title><desc id="desc">Citizen web and Capacitor Android clients and municipal administrators use the Vue frontend, which calls Laravel and Sanctum. Laravel uses MySQL, private local or private R2 evidence storage, and a queue for Firebase push notifications.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#75917e"/></marker><style>text{font-family:Arial,sans-serif;fill:#28513f}.title{font-size:22px;font-weight:700}.head{font-size:16px;font-weight:700}.sub{font-size:12px;fill:#65816c}.box{fill:#f1f6ef;stroke:#c6d8c9;stroke-width:1.5;rx:12}.line{stroke:#75917e;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1100" height="660" fill="white"/><text x="35" y="40" class="title">Municipal Hazard Reporting — Component Architecture</text><rect class="box" x="35" y="75" width="250" height="95"/><text x="60" y="111" class="head">Android + responsive web</text><text x="60" y="137" class="sub">Camera · GPS · manual hazard pin</text><rect class="box" x="425" y="75" width="250" height="95"/><text x="450" y="111" class="head">Capacitor Android</text><text x="450" y="137" class="sub">Shared Vue client + native plugins</text><rect class="box" x="815" y="75" width="250" height="95"/><text x="840" y="111" class="head">Municipal administrator</text><text x="840" y="137" class="sub">Verify · assign · respond · resolve</text><path class="line" d="M160 170V195H550V215"/><path class="line" d="M550 170V215"/><path class="line" d="M940 170V195H550V215"/><rect class="box" x="335" y="218" width="430" height="85"/><text x="362" y="252" class="head">Vue 3 + TypeScript frontend</text><text x="362" y="278" class="sub">Views / components / composables / API services</text><rect class="box" x="35" y="218" width="240" height="85"/><text x="55" y="252" class="head">MapLibre + map provider</text><text x="55" y="277" class="sub">Markers and optional boundaries</text><path class="line" d="M335 260H280"/><path class="line" d="M550 303V355"/><text x="568" y="336" class="sub">HTTPS JSON / multipart</text><rect x="335" y="359" width="430" height="100" rx="12" fill="#24533f"/><text x="362" y="396" class="head" style="fill:white">Laravel 12 + Sanctum API</text><text x="362" y="422" class="sub" style="fill:#c8dfcc">Validation · roles · workflow · location evidence</text><text x="362" y="442" class="sub" style="fill:#c8dfcc">Transactions · audit · private notification inbox</text><path class="line" d="M455 459V487H160V522"/><path class="line" d="M550 459V522"/><path class="line" d="M645 459V487H940V522"/><rect class="box" x="35" y="526" width="250" height="100"/><text x="60" y="564" class="head">MySQL</text><text x="60" y="588" class="sub">Reports, accounts, status history,</text><text x="60" y="608" class="sub">photo metadata, audit and tokens</text><rect class="box" x="425" y="526" width="250" height="100"/><text x="450" y="564" class="head">Private evidence service</text><text x="450" y="588" class="sub">Owner/admin access ? WebP</text><text x="450" y="608" class="sub">Private local disk or private R2</text><rect class="box" x="815" y="526" width="250" height="100"/><text x="840" y="564" class="head">Queue → Firebase FCM</text><text x="840" y="588" class="sub">Atomic jobs + scheduled worker</text><text x="840" y="608" class="sub">Optional FCM ? verify delivery</text></svg>
